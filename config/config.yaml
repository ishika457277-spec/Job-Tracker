# Everything you would want to tune lives in this file.
# Constraints below are a starting point based on the policy / governance / research
# roles you were searching for (Japan, Korea, India, remote). Edit freely.

max_digest: 30            # most jobs sent per day; the rest wait until tomorrow

profile:
  # 1) Domain words: a match in the TITLE is enough on its own.
  include_title_any:
    - policy
    - governance
    - "ai safety"
    - "responsible ai"
    - "ai ethics"
    - ethics
    - "trust and safety"
    - "digital rights"
    - "human rights"
    - "technology policy"
    - "tech policy"
    - "digital policy"
    - "public policy"
    - regulation
    - "program officer"
    - "programme officer"
    - misinformation
    - disinformation
    - "media literacy"
    - "child safety"
    - "child protection"
    - "child rights"
    - "children's rights"
    - "online safety"
    - safeguarding
    - child
    - children
    - youth
    - edtech
    - "education policy"
    - "digital literacy"
  # 2) Generic role words: count only if the listing also mentions a domain phrase below
  #    (or has no description at all, as on title-only careers pages).
  generic_title_any:
    - research
    - researcher
    - analyst
    - associate
    - assistant
    - fellow
    - fellowship
    - scholar
    - consultant
    - coordinator
    - officer
    - intern
    - internship
    - trainee
    - junior
    - "entry level"
    - "entry-level"
    - graduate
    - "early career"
    - "early-career"
    - apprentice
    - teacher
    - educator
    - curriculum
    - "learning designer"
    - "instructional designer"
    - "learning experience"
    - trainer
    - "content designer"
    - moderator
  generic_min_text_hits: 1
  # 3) Domain phrases looked for in title + description.
  include_text_any:
    - "ai governance"
    - "ai policy"
    - "ai safety"
    - "tech policy"
    - "technology policy"
    - "digital policy"
    - "digital rights"
    - "responsible ai"
    - "ai ethics"
    - "trust and safety"
    - "human rights"
    - "algorithmic accountability"
    - "algorithmic"
    - "online safety"
    - "data protection"
    - privacy
    - "internet governance"
    - "media literacy"
    - misinformation
    - disinformation
    - "human-computer interaction"
    - "generative ai"
    - "child rights"
    - "children's rights"
    - "child safety"
    - "child protection"
    - "child online"
    - "online child"
    - "child sexual"
    - "age-appropriate"
    - "age assurance"
    - "age verification"
    - safeguarding
    - "online harms"
    - "digital wellbeing"
    - "digital well-being"
    - edtech
    - "education technology"
    - "digital literacy"
    - "children and technology"
    - "children's privacy"
    - "young people"
  min_text_hits: 3        # a listing with no domain word in its title needs this many phrases
  # Dealbreakers (matched as whole words)
  exclude_title_any:
    - senior
    - "sr."
    - director
    - "head of"
    - vp
    - "vice president"
    - principal
    - chief
    - staff
    - lead
    - ii
    - iii
    - iv
    - postdoc
    - postdoctoral
    - professor
    - "software engineer"
    - "machine learning engineer"
    - sales
    - "account executive"
  exclude_text_any:
    - "security clearance"
    - "must be a us citizen"
    - "u.s. citizenship required"
    - "5+ years"
    - "6+ years"
    - "7+ years"
    - "8+ years"
    - "10+ years"
    - "at least 5 years"
    - "minimum 5 years"
    - "minimum of 5 years"
    - "phd required"
    - "doctorate required"
  # Where you would work. Remote listings also pass unless restricted to a region below.
  locations_any:
    - japan
    - tokyo
    - osaka
    - kyoto
    - korea
    - seoul
    - busan
    - india
    - mumbai
    - delhi
    - gurgaon
    - gurugram
    - noida
    - bengaluru
    - bangalore
    - hyderabad
    - chennai
    - pune
    - kolkata
    - "south asia"
    - apac
    - asia
  allow_remote: true
  remote_exclude_any:
    - "us only"
    - usa
    - "united states"
    - "u.s."
    - "(us)"
    - "us-based"
    - "us based"
    - canada
    - "uk only"
    - "eu only"
    - "europe only"
    - emea
    - latam
  unknown_location: keep   # keep | drop  (many NGO pages never state a location)
  max_age_days: 45

# Optional fuzzy judgement on the survivors, Gemini free tier (set GEMINI_API_KEY).
# Only max_per_run jobs are ever sent, in batches, so a daily run is ~5 requests.
llm:
  enabled: true
  model: gemini-2.5-flash
  max_per_run: 40
  batch_size: 8
  pause_seconds: 5
  min_score: 6
  profile: >
    Early-career candidate (0-2 years of work experience; BCA graduate with 2 years of
    teaching experience; research background in generative AI, HCI and interactive media)
    based in India. Her focus is CHILD RIGHTS IN THE TECH SPACE: child online safety,
    children's digital rights, age-appropriate design, child protection, trust and safety
    for young users, edtech and digital literacy, and the AI/tech policy around these.
    Wants internships, fellowships, research-assistant, analyst, programme, teaching or
    curriculum-design and junior roles. Open to remote work that accepts India-based
    candidates, or on-site in India, Japan or South Korea. Rank roles that combine children
    with technology highest. Not interested in senior or managerial roles, pure software
    engineering, sales, roles needing a PhD, or roles restricted to US/EU/UK residents.

