# Everything you would want to tune lives in this file.
# Constraints below are a starting point based on the policy / governance / research
# roles you were searching for (Japan, Korea, India, remote). Edit freely.

max_digest: 30            # most jobs sent per day; the rest wait until tomorrow

profile:
  # A job must have one of these words in its TITLE ...
  include_title_any:
    - policy
    - governance
    - "ai safety"
    - "responsible ai"
    - "ai ethics"
    - "trust and safety"
    - "digital rights"
    - research
    - researcher
    - analyst
    - "program officer"
    - "programme officer"
    - fellow
    - fellowship
    - associate
    - "research assistant"
    - "technology policy"
    - "tech policy"
    - consultant
    - "interactive narrative"
    - "narrative designer"
  # ... or at least `min_text_hits` of these in the title + description.
  include_text_any:
    - "ai governance"
    - "tech policy"
    - "technology policy"
    - "digital rights"
    - "responsible ai"
    - "ai policy"
    - "human-computer interaction"
    - hci
    - "computational creativity"
    - "generative ai"
    - "interactive narrative"
    - "media literacy"
    - "algorithmic"
  min_text_hits: 3
  # Dealbreakers (matched as whole words)
  exclude_title_any:
    - senior
    - "sr."
    - director
    - "head of"
    - vp
    - "vice president"
    - principal
    - chief
    - staff
    - lead
    - "phd required"
    - "software engineer"
    - "machine learning engineer"
    - "sales"
    - "account executive"
  exclude_text_any:
    - "security clearance"
    - "must be a us citizen"
    - "u.s. citizenship required"
  # Where you'd work. Remote listings also pass unless restricted to a region below.
  locations_any:
    - japan
    - tokyo
    - osaka
    - kyoto
    - korea
    - seoul
    - india
    - mumbai
    - delhi
    - bengaluru
    - bangalore
    - singapore
    - apac
    - asia
    - geneva
    - brussels
  allow_remote: true
  remote_exclude_any:
    - "us only"
    - "usa"
    - "united states"
    - "u.s."
    - "(us)"
    - "us-based"
    - "us based"
    - "canada"
    - "uk only"
    - "eu only"
    - "europe only"
    - "emea"
    - "latam"
  unknown_location: keep   # keep | drop  (many NGO pages never state a location)
  max_age_days: 45

# Optional fuzzy judgement on the survivors, Gemini free tier (set GEMINI_API_KEY).
# Only max_per_run jobs are ever sent, in batches, so a daily run is ~5 requests.
llm:
  enabled: true
  model: gemini-2.5-flash
  max_per_run: 40
  batch_size: 8
  pause_seconds: 5
  min_score: 6
  profile: >
    Early-career candidate based in India, open to Japan, South Korea, India or remote
    work. Wants AI governance, tech policy, digital rights, HCI or interactive-media
    research, fellowships and research-assistant roles. Not interested in senior roles,
    pure software engineering, sales, or roles requiring a PhD or a specific citizenship.

sources:
