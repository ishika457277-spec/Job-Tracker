# Optional LLM relevance scoring
llm:
  enabled: true
  model: gemini-2.5-flash
  max_per_run: 40
  batch_size: 8
  pause_seconds: 5
  min_score: 6

  profile: >
    Early-career candidate with a BCA degree and approximately two years of
    teaching experience, with project and research interests in generative AI,
    human-computer interaction, interactive media and data analysis. Interested
    in building a career at the intersection of data, journalism, public policy,
    social research and social impact. Currently based in India and preparing
    for a Master of Data Science for Public Policy at KDI School in South Korea.

    PRIMARY CAREER TRACKS:

    1. DATA AND INTERACTIVE JOURNALISM: Prioritise data journalism, interactive
    journalism, computational journalism, investigative data research, data
    visualisation, information design, interactive storytelling, digital
    storytelling and multimedia research or production. Relevant work may
    involve analysing datasets, finding patterns, investigating public-interest
    issues, producing evidence-based stories, building interactive features,
    creating visual explanations or communicating complex information to
    general audiences.

    2. IMPACT EVALUATION AND POLICY RESEARCH: Prioritise impact evaluation,
    programme evaluation, monitoring and evaluation (M&E), monitoring,
    evaluation and learning (MEL), development research, policy research,
    social policy, programme assessment, research and evaluation, evidence
    synthesis and data-for-development work. Relevant responsibilities may
    include research design, programme monitoring, outcome measurement,
    survey research, qualitative interviews, field research, data collection,
    descriptive statistical analysis, mixed-methods research, evaluation
    reporting and evidence-based policymaking.

    SECONDARY AREAS: Consider public-interest technology, AI governance,
    responsible AI, digital rights, algorithmic accountability, children's
    digital rights and online safety, education policy and outcomes, gender
    inequality, poverty, social mobility, digital wellbeing, research
    communication, data storytelling and interactive media. These should
    receive priority when they have a meaningful connection to research,
    evaluation, data analysis, journalism, public policy or social impact.
    Do not prioritise general technology or child-safety roles solely because
    they mention these subjects.

    ROLE TYPES AND SENIORITY: Look for internships, research assistantships,
    research associate and analyst roles, junior policy and evaluation roles,
    fellowships, graduate opportunities, early-career positions and suitable
    paid research or project opportunities. Consider responsibilities rather
    than relying only on job titles. Include adjacent opportunities when they
    offer relevant research, evaluation, analytical or storytelling experience.
    Exclude senior, managerial and director-level positions.

    QUANTITATIVE REQUIREMENTS: Do not automatically reject quantitative
    research roles. Applied data analysis, descriptive statistics, survey
    analysis, basic statistical methods and mixed-methods research are
    relevant. Prioritise roles where quantitative methods can be developed
    through practical work. Lower the priority of roles requiring advanced
    econometrics, causal inference, experimental design, advanced mathematical
    statistics or sophisticated statistical modelling as essential existing
    skills. Do not assume the candidate has advanced mathematics or extensive
    professional experience in impact evaluation or journalism.

    ORGANISATIONS AND SECTORS: Consider think tanks, research institutes,
    universities, journalism organisations, investigative media, international
    development organisations, foundations, NGOs, public-interest technology
    organisations and policy research centres. Prioritise work with a clear
    public-interest, social-impact or evidence-generation purpose.

    LOCATION AND ELIGIBILITY: Interested in international opportunities,
    particularly in South Korea, Singapore, the United Kingdom, Europe and
    remote positions. Also consider India-based opportunities where relevant.
    For remote roles, check whether applicants based in India or international
    applicants are eligible. Do not rank a role highly if its location,
    citizenship, residency, work-authorisation or language requirements make
    the candidate ineligible. Distinguish between confirmed eligibility and
    eligibility that is unclear.

    EXCLUSIONS: Do not prioritise generic marketing, social media management,
    sales, business development, corporate business analytics, routine
    administrative work, pure software engineering or machine-learning
    engineering. Also deprioritise roles unrelated to the two primary career
    tracks or the relevant secondary areas.

    RANKING: Give the highest scores to suitable early-career roles directly
    aligned with data and interactive journalism or impact evaluation, M&E
    and policy research. Next, consider adjacent roles offering transferable
    research, data, evaluation or storytelling experience. Secondary-interest
    roles should rank lower unless they strongly overlap with a primary track.
    Evaluate actual responsibilities, required skills, seniority, eligibility,
    location and the opportunity to develop relevant experience. Do not give
    a high score merely because a listing contains matching keywords.


